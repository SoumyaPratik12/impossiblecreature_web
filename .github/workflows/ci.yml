name: Prototype CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repository structure
        run: python tests/validate_repository.py

      - name: Check JavaScript syntax
        run: |
          node --check prototype/src/main.js
          node --check prototype/src/game-core.js
          node --check prototype/src/creature-catalog.js
          node --check prototype/src/world-view.js
          node --check prototype/src/webgpu-renderer.js
          node --check prototype/src/webgpu-capability.js
          node --check prototype/src/webgpu-test.js

      - name: Run gameplay and persistence tests
        run: node --test tests/game-core.test.js

      - name: Run browser interaction tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser-interactions.test.cjs

      - name: Package static prototype
        run: |
          mkdir -p dist
          cp -R prototype/. dist/
          cd dist
          zip -r ../browser-prototype.zip .

  wasm-smoke-test:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile minimal WebAssembly module
        run: |
          mkdir -p dist/wasm
          emcc wasm/hello.c -O2 -s WASM=1 -s MODULARIZE=1 -s EXPORT_ES6=1 -s EXPORT_NAME=createRuntimeModule -s ENVIRONMENT=node -s EXPORTED_FUNCTIONS='["_runtime_add","_runtime_version"]' -o dist/wasm/runtime.mjs

      - name: Verify WebAssembly function from Node.js
        run: |
          node --input-type=module -e "import('./dist/wasm/runtime.mjs').then(async ({default: createRuntimeModule}) => { const runtime = await createRuntimeModule(); const result = runtime._runtime_add(19, 23); if (result !== 42) throw new Error('WASM smoke test failed: ' + result); console.log('WASM smoke test passed:', result); })"

      - name: Upload WebAssembly build
        uses: actions/upload-artifact@v4
        with:
          name: wasm-runtime-spike
          path: dist/wasm/
