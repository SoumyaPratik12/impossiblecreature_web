name: Prototype CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate repository structure
        run: python tests/validate_repository.py

      - name: Check JavaScript syntax
        run: node --check prototype/src/main.js

      - name: Package static prototype
        run: |
          mkdir -p dist
          cp -R prototype/. dist/
          cd dist
          zip -r ../browser-prototype.zip .
